# Ambiente local isolado da nova Locadora; não lê .env.docker do legado.
# PostgreSQL 18 usa volume novo: nunca apontar este volume para os dados PostgreSQL 15.
name: locadora-equipamentos-saas
services:
  api:
    build:
      context: .
      dockerfile: apps/services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://locadora_local:local-only@db:5432/locadora_workspace
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_URL_INTERNAL: http://localhost:3002
      NEXTAUTH_SECRET:
        ${LOCAL_NEXTAUTH_SECRET:?Defina um segredo sintético exclusivo deste
        ambiente local}
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      - db
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: locadora_local
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: locadora_workspace
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - workspace-db-v18:/var/lib/postgresql
volumes:
  workspace-db-v18:
    name: locadora-equipamentos-saas-pg18
